<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heroes · Delve</title>
  <meta name="description" content="Every hero in the dungeon, their bag, time bonus and odds this hour.">
  <meta property="og:title" content="Delve">
  <meta property="og:description" content="Drop your bag into the shaft. Deepest hero collects the hour's fees.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="gut">
    <div class="page-head">
      <div class="kicker"><span id="count">0</span> heroes in the dungeon</div>
      <h1>Who falls this hour.</h1>
      <p>Odds are bag × time bonus as a share of the total, measured when the hour began. A hero that joined mid-hour waits for the next one.</p>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>hero</th><th>owner</th><th class="num">bag</th><th class="num">bonus</th><th class="num">odds</th><th class="num">wins</th></tr></thead>
        <tbody id="rows"><tr><td colspan="7" class="mute">Reading the dungeon…</td></tr></tbody>
      </table>
    </div>
    <h2 class="h2" style="margin-top:72px">Recent winners.</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>hour</th><th>winner</th><th class="num">pot</th><th>seed</th><th class="num">when</th></tr></thead>
        <tbody id="past"></tbody>
      </table>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/config.js"></script>
  <script src="assets/sim.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/heroes.js"></script>
</body>
</html>
